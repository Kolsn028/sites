name: Colombo storage checks
on:
  pull_request:
    paths:
      - 'colombo-bot-v2/**'
      - '.github/workflows/colombo-storage-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: colombo-bot-v2
      - run: python -m unittest discover -s tests
        working-directory: colombo-bot-v2
